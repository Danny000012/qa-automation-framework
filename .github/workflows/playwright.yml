name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests matching this tag or title (e.g. @smoke)'
        required: false
        default: ''
  schedule:
    - cron: '0 4 * * 1-5' # weekdays 04:00 UTC

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  # Set these as repository Variables / Secrets. Empty values fall back to defaults.
  UI_BASE_URL: ${{ vars.UI_BASE_URL }}
  UI_USERNAME: ${{ secrets.UI_USERNAME }}
  UI_PASSWORD: ${{ secrets.UI_PASSWORD }}
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  API_USERNAME: ${{ secrets.API_USERNAME }}
  API_PASSWORD: ${{ secrets.API_PASSWORD }}

jobs:
  quality:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  api:
    name: API tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run API tests
        run: npx playwright test --project=api ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: api-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  ui:
    name: UI tests (${{ matrix.project }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ui-chromium, ui-firefox, ui-webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.project == 'ui-chromium' && 'chromium' || matrix.project == 'ui-firefox' && 'firefox' || 'webkit' }}
      - name: Run UI tests
        run: npx playwright test --project=${{ matrix.project }} ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.project }}-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
